name: One-time domain registry correction

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/correct-domain-registry.yml'

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore source spell records and importer
        run: |
          set -euo pipefail
          git checkout 3e659733b38dce83aaa369c33b12029b190702f0 --             03_spells/index             03_spells/catalog             03_spells/review             03_spells/manifest.json             tools/import_spellbook.py
          rm -f tools/repair_spell_domain_levels.py

      - name: Install domain and circle registry layer
        shell: bash
        env:
          PACK_URL: "https://sdmntprjapaneast.oaiusercontent.com/files/00000000-f560-8209-b95c-10ba69beaf3c/raw?se=2026-09-20T21%3A40%3A05Z&sp=r&sv=2026-02-06&sr=b&scid=dbbcea2e-d3bd-5029-822a-2f67421423a6&skoid=0b778285-7b0b-4cdc-ac3b-fb93e8c3686f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-20T16%3A56%3A18Z&ske=2026-09-21T16%3A56%3A18Z&sks=b&skv=2026-02-06&sig=LQwkI0WLa8YI8oCaexKnSL1lO/ydNMOaNYwzm3W6vB8%3D"
        run: |
          set -euo pipefail
          curl -fL "$PACK_URL" -o /tmp/domain_registry_pack.tar.gz
          echo "d2ff2e4acf8c365f60feab81725059af01ee1775b563e9c026908d0be6e9627a  /tmp/domain_registry_pack.tar.gz" | sha256sum -c -
          tar -xzf /tmp/domain_registry_pack.tar.gz -C .

      - name: Validate source immutability and registry
        run: |
          python3 - <<'PY'
          import json, glob

          total = sum(sum(1 for _ in open(p, encoding="utf-8"))
                      for p in glob.glob("03_spells/index/*.jsonl"))
          assert total == 2405, total

          sure = None
          for line in open("03_spells/index/S.jsonl", encoding="utf-8"):
              r = json.loads(line)
              if r.get("name_en") == "Surelife":
                  sure = r
                  break
          assert sure is not None
          assert sure["levels"] == [], sure["levels"]
          assert sure["level_text_raw"] == "安息領域 8"
          assert "no_normalized_spell_levels" in sure["review"]["flags"]

          reg = json.load(open("03_spells/domain_circle_registry.json", encoding="utf-8"))
          assert reg["d100_domain_system"]["registered_count"] == 87
          pending = [x for x in reg["d100_domain_system"]["registered_domains"]
                     if x["domain_feat_status"] == "pending"]
          assert len(pending) == 84, len(pending)
          assert len(reg["d100_domain_system"]["implemented_domains"]) == 10
          assert len(reg["d100_druid_circles"]["circles"]) == 4

          rev = json.load(open("03_spells/domain_spell_map.json", encoding="utf-8"))
          assert rev["policy"]["source_spell_records_are_read_only"] is True
          repose = next(x for x in rev["domains"] if x["name"] == "安息")
          assert any(x["name_en"] == "Surelife" and x["level"] == 8 for x in repose["spells"])
          PY

          grep -q "NO RAW COPY ≠ NO CONVERSION" 90_srd_bridge/conversion_rules.md

      - name: Commit correction and remove one-time workflow
        run: |
          set -euo pipefail
          rm -f .github/workflows/correct-domain-registry.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Register expansion domains without rewriting spell entries"
          git push origin HEAD:main
