name: One-time domain repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-domain-levels.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair domain levels
        run: python3 tools/repair_spell_domain_levels.py

      - name: Validate Surelife and registry
        run: |
          python3 - <<'PY'
          import json, glob
          reg=json.load(open("03_spells/domain_circle_registry.json",encoding="utf-8"))
          assert len(reg["spellbook_domains"]["domains"]) == 86
          assert len(reg["d100_cleric_domains"]["canon"]) == 10
          assert len(reg["d100_druid_circles"]["circles"]) == 4
          found=False
          for p in glob.glob("03_spells/index/*.jsonl"):
              for line in open(p,encoding="utf-8"):
                  r=json.loads(line)
                  if r.get("name_en")=="Surelife":
                      found=True
                      assert any(x.get("kind")=="domain" and x.get("domain")=="安息" and x.get("level")==8 for x in r["levels"]), r["levels"]
                      assert "no_normalized_spell_levels" not in r["review"]["flags"]
          assert found
          PY

      - name: Commit repair and remove one-time workflow
        run: |
          rm -f .github/workflows/repair-domain-levels.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Normalize domain spell levels in lookup index"
          git push origin HEAD:main
